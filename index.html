<!DOCTYPE html>
<html>
    <head>Form To Be filled</head>
    <form>
        <h1>Student Registration Form</h1>
        <label>Name:</label>
        <input type="text" required>
        <br><br>
        <label>Email:</label>
        <input type="email" required>
        <br><br>
        <label>Password:</label>
        <input type="password">
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female
        <input type="radio" name="Gender">Others
        <br><br>
        <label>Skills:</label>
        <input type="checkbox" name="Skills">Java
        <input type="checkbox" name="Skills">C++
        <input type="checkbox" name="Skills">Python
        <br><br>
        <label>Address:</label>
        <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>
        <label>Upload you photo:</label>
        <input type="file">
        <br><br>
        <input type="checkbox">I agree to all terms and conditions.
        <br><br>
        <button type="submit">Submit</button>
    </form>
</html>
